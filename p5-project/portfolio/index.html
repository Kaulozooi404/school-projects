<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Project Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>p5.js Project Portfolio</h1>

  <!-- Buttons to load each project -->
  <button onclick="loadProject('projects/2d-array-pixelart/index.html')">2D Array Pixelart</button>
  <button onclick="loadProject('projects/array-excercise/index.html')">Array Exercise</button>
  <button onclick="loadProject('projects/bingokaart/index.html')">Bingokaart</button>
  <button onclick="loadProject('projects/boter-kaas-eieren/index.html')">Boter Kaas Eieren</button>
  <button onclick="loadProject('projects/dier/index.html')">Dier</button>
  <button onclick="loadProject('projects/flocking-simulatie/index.html')">Flocking Simulatie</button>
  <button onclick="loadProject('projects/landschap/index.html')">Landschap</button>
  <button onclick="loadProject('projects/quiz/index.html')">Quiz</button>

  <!-- iFrame to load the project -->
  <iframe id="project-frame" width="100%" height="200px" style="border: 1px solid #ccc;"></iframe>

  <script>
    function loadProject(projectPath) {
      // Load the project into the iframe
      document.getElementById('project-frame').src = projectPath;
    }
  </script>
</body>
</html>
