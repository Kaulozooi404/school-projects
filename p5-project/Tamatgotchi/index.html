<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/7026fad4f7.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="script.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div class="stats-container">
      <h1>STATS</h1>
      <div class="stats-wrapper">
        <div class="stats-styling stats-hunger">Hunger: 70%</div>
        <div class="stats-styling stats-thirst">Thirst: 60%</div>
        <div class="stats-styling stats-sleep">Sleep: 80%</div>
      </div>
    </div>

    <div class="game-container">
      <h1>GAME</h1>
      <div class="stats-styling stats-coins">Coins: 0</div>
      <div class="screen-container">
        <h1
          class="animate__animated animate__pulse animate__infinite infinite game-title"
          onclick="initializeGame()"
        >
          CLICK HERE TO START
        </h1>
      </div>
    </div>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Anta&family=Rubik+Puddles&family=VT323&display=swap");

      html,
      body {
        margin: 0;
        padding: 0;
      }

      canvas {
        display: block;
      }

      .shop-btn {
        width: 100px;
        height: 50px;
        border-radius: 100vh;
        cursor: pointer;
      }

      .shop-btn:hover {
        width: 300px;
      }

      /* Modal Styles */
      #shopModal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 50%;
        text-align: center;
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }

      .stats-container {
        position: absolute;
        top: 100px;
        left: 1000px;
        width: 500px;
        height: 700px;
        border-radius: 1vh;
        background-color: #282424;
      }

      .stats-container h1 {
        font-family: "Rubik Puddles", system-ui;
        color: white;
        font-size: 5rem;
        text-align: center;
        margin-top: 20px;
      }

      .stats-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 80%;
        width: 100%;
        gap: 20px; /* space between stats */
      }

      .stats-styling {
        /* width: 90%; */
        background-color: white;
        padding: 10px;
        font-size: 2rem;
        font-family: "Anta", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: #282424;
        text-align: center;
        border-radius: 10px;
        transition: 1s;
      }

      /* Specific styling for individual stats */
      .stats-hunger {
        background-color: #ff6666; /* Red for hunger */
      }

      .stats-thirst {
        background-color: #66ff66; /* Green for thirst */
      }

      .stats-sleep {
        background-color: #66b2ff; /* Blue for sleep */
      }

      .game-container {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        top: 100px;
        left: 1600px;
        width: 500px;
        height: 700px;
        border-radius: 1vh;
        background-color: #282424;
      }

      .game-container h1 {
        font-family: "Rubik Puddles", system-ui;
        color: white;
        font-size: 5rem;
        margin: 20px;
      }

      .screen-container {
        background-color: #282424;
        width: 100%;
        height: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .screen-container h1 {
        margin-bottom: 100px;
        font-family: "VT323", monospace;
        font-weight: 400;
        font-style: normal;
        font-size: 3rem;
        cursor: pointer;
      }

      .spaceship {
        margin-top: 375px;
        transition: 0.1s;
      }

      .star {
        width: 30px;
        height: 30px;
        background-color: red;
        position: absolute;
        border-radius: 50%;
      }

      .bullet {
        width: 5px;
        height: 20px;
        background-color: yellow;
        position: absolute;
        transition: 0.1s;
      }
    </style>
  </body>
</html>
